<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>斜抛运动仿真‑速度矢量</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f6f6f6;
  padding:20px;
}
.box{
  background:#fff;
  padding:20px;
  max-width:460px;
  border:1px solid #ccc;
}
canvas{
  border:1px solid #333;
  background:#ffffff;
}
.ctrl{
  margin:10px 0;
}
.info{
  margin:8px 0;
  min-height:24px;
}
button{
  padding:6px 14px;
  margin:0 4px;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="box">
<h3>斜抛运动（速度矢量箭头）</h3>
<div class="ctrl">
<label>初速度 v₀：<span id="v0Text">8</span> m/s</label>
<input id="v0Slider" type="range" min="0" max="15" value="8" step="1" style="width:280px;">
</div>
<div class="ctrl">
<label>发射角度 θ：<span id="angText">45</span> °</label>
<input id="angSlider" type="range" min="0" max="90" value="45" step="1" style="width:280px;">
</div>
<div class="ctrl">
<label>初始发射高度 h：<span id="hText">3</span> m</label>
<input id="hSlider" type="range" min="0" max="15" value="3" step="1" style="width:280px;">
</div>
<div class="ctrl">
<button id="startBtn">开始</button>
<button id="resetBtn">重置</button>
</div>
<div class="info" id="infoText"></div>
<canvas id="canvas" width="420" height="400"></canvas>
</div>

<script>
const g = 9.8;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const scale = 12;
const originX = 50;
const groundY = H - 60;
const vecScale = 1.5; //矢量箭头缩放系数

const v0Slider = document.getElementById("v0Slider");
const v0Text = document.getElementById("v0Text");
const angSlider = document.getElementById("angSlider");
const angText = document.getElementById("angText");
const hSlider = document.getElementById("hSlider");
const hText = document.getElementById("hText");
const startBtn = document.getElementById("startBtn");
const resetBtn = document.getElementById("resetBtn");
const infoText = document.getElementById("infoText");

let running = false;
let animId;
let t = 0;
let v0 = 8;
let angleDeg = 20;
let launchHeight = 3;
let angle, vx0, vy0;
//轨迹同时保存位置、该点速度
let trail = [];

//绘制箭头工具函数
function drawArrow(fromX, fromY, toX, toY, color="#000000"){
  const headLen = 8;
  const angle = Math.atan2(toY-fromY, toX-fromX);
  ctx.beginPath();
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(toX, toY);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();
  //箭头三角
  ctx.beginPath();
  ctx.moveTo(toX, toY);
  ctx.lineTo(toX - headLen*Math.cos(angle-Math.PI/6), toY - headLen*Math.sin(angle-Math.PI/6));
  ctx.lineTo(toX - headLen*Math.cos(angle+Math.PI/6), toY - headLen*Math.sin(angle+Math.PI/6));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  //地面
  ctx.beginPath();
  ctx.moveTo(0,groundY);
  ctx.lineTo(W,groundY);
  ctx.strokeStyle="#222";
  ctx.lineWidth=2;
  ctx.stroke();

  //绘制蓝色轨迹线
  ctx.beginPath();
  trail.forEach((p,i)=>{
    const px = originX + p.x*scale;
    const py = groundY - p.y*scale;
    if(i===0) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  });
  ctx.strokeStyle="#4488ff";
  ctx.lineWidth=2;
  ctx.stroke();

  //每隔若干点绘制速度矢量
  for(let i = 0; i < trail.length; i += 8){
    const p = trail[i];
    const px = originX + p.x*scale;
    const py = groundY - p.y*scale;
    const vxPix = p.vx * vecScale;
    const vyPix = -p.vy * vecScale;
    drawArrow(px, py, px+vxPix, py+vyPix);
  }

  //当前小球位置
  const x = vx0*t;
  const y = launchHeight + vy0*t - 0.5*g*t*t;
  const ballX = originX + x*scale;
  const ballY = groundY - y*scale;

  //红色小球
  ctx.beginPath();
  ctx.arc(ballX,ballY,6,0,Math.PI*2);
  ctx.fillStyle="#dd2222";
  ctx.fill();

  //小球上实时速度箭头
  const curVy = vy0 - g*t;
  drawArrow(ballX, ballY, ballX + vx0*vecScale, ballY - curVy*vecScale,"#ff0000");

  const speed = Math.hypot(vx0, curVy);
  infoText.innerText = `t=${t.toFixed(2)}s，x=${x.toFixed(2)}m，y=${y.toFixed(2)}m，vx=${vx0.toFixed(2)}, vy=${curVy.toFixed(2)},速率=${speed.toFixed(2)} m/s`;
  if(y <= 0) running = false;
}

function animate(){
  if(!running) return;
  t += 0.025;
  const x = vx0*t;
  const y = launchHeight + vy0*t - 0.5*g*t*t;
  const vyNow = vy0 - g*t;
  trail.push({x, y, vx:vx0, vy:vyNow});
  draw();
  animId = requestAnimationFrame(animate);
}

function reset(){
  cancelAnimationFrame(animId);
  running = false;
  t = 0;
  v0 = Number(v0Slider.value);
  angleDeg = Number(angSlider.value);
  launchHeight = Number(hSlider.value);
  angle = angleDeg * Math.PI / 180;
  vx0 = v0 * Math.cos(angle);
  vy0 = v0 * Math.sin(angle);
  trail = [{x:0,y:launchHeight, vx:vx0, vy:vy0}];
  draw();
}

v0Slider.oninput = function(){
  v0Text.textContent = this.value;
  reset();
};
angSlider.oninput = function(){
  angText.textContent = this.value;
  reset();
};
hSlider.oninput = function(){
  hText.textContent = this.value;
  reset();
};
startBtn.onclick = function(){
  if(running) return;
  reset();
  running = true;
  animate();
};
resetBtn.onclick = reset;
reset();
</script>
</body>
</html>
